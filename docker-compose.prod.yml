services:
  hlm:
    image: ghcr.io/marod1m/hlm-demo:${IMAGE_TAG:-latest}
    container_name: hlm-demo
    restart: unless-stopped
    # 显式使用 bridge 网络，确保容器可正常访问外网（如 Telegram API）
    network_mode: bridge
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      # 应用密钥（生产环境务必使用强随机值）
      SECRET_KEY: ${SECRET_KEY}
      # 可选：访问账号密码（留空=不启用登录）
      APP_USERNAME: ${APP_USERNAME:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      # 可选：HTTP 请求超时（秒）
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-10}
      ACCESS_LOG_ENABLED: ${ACCESS_LOG_ENABLED:-true}
      # 时区
      TZ: ${TZ:-Asia/Shanghai}
      PYTHONUNBUFFERED: "1"
      APP_LOG_MAX_MB: ${APP_LOG_MAX_MB:-10}
      APP_LOG_BACKUP_COUNT: ${APP_LOG_BACKUP_COUNT:-5}
    volumes:
      # 必须：数据库与运行状态
      - ./data/instance:/app/instance
      # 建议：数据库备份目录
      - ./data/backups:/app/data/backups
      - ./data/logs:/app/data/logs
      # 推荐：单目录映射，程序内自定义子目录
      - ${MEDIA_ROOT}:/media:rw
      # 可选（非必要）：如需双目录固定映射可取消注释
      # - ${DOWNLOADS_PATH}:/downloads:rw
      # - ${LIBRARY_PATH}:/library:rw
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backup:
    image: alpine:3.21
    container_name: hlm-backup
    profiles: ["backup"]
    restart: "no"
    volumes:
      - ./data/instance:/data/instance:ro
      - ./data/backups:/data/backups:rw
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -e
      TS=$(date +%Y%m%d-%H%M%S)
      cp /data/instance/hardlink_manager.db /data/backups/hardlink_manager-${TS}.db
      ls -1t /data/backups/hardlink_manager-*.db | tail -n +8 | xargs -r rm -f
      echo "backup done: ${TS}"
