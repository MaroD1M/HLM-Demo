<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - Hardlink Manager</title>
  <link href="/static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="/static/vendor/fontawesome/css/all.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
  <style>
    :root { --ink:#102027; --paper:#f5f8ff; --line:#d8e1ea; --brand:#10a37f; --brand2:#0d5f7a; }
    *{font-family:var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif)}
    body{min-height:100vh;display:grid;place-items:center;color:var(--ink);background:radial-gradient(900px 380px at -8% -10%,#d9f7f1 0%,transparent 60%),radial-gradient(700px 360px at 108% 0%,#d7edf7 0%,transparent 58%),var(--paper)}
    .card{width:min(92vw,460px);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 32px rgba(12,32,54,.12)}
    .btn-brand{background:linear-gradient(120deg,var(--brand2),var(--brand));border-color:var(--brand2);color:#fff}
    .btn-brand:hover{filter:brightness(1.03);color:#fff}
  </style>
</head>
<body>
  <div class="card p-4">
    <h4 class="mb-1">Hardlink Manager</h4>
    <div class="text-muted mb-3">请输入账号密码继续</div>
    <div class="alert alert-secondary py-2" role="alert">
      <i class="fa-solid fa-circle-info"></i> 忘记账号或密码？请在部署环境变量中修改 <code>APP_USERNAME</code> / <code>APP_PASSWORD</code>，然后重启应用生效。登录凭据不存入数据库。
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} py-2">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next_path or '/' }}">
      <div class="mb-3">
        <label class="form-label">用户名</label>
        <input class="form-control" name="username" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label">密码</label>
        <input class="form-control" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="remember_me" id="remember_me" checked>
        <label class="form-check-label" for="remember_me">记住我（保持登录）</label>
      </div>
      <button class="btn btn-brand w-100" type="submit">登录</button>
    </form>
  </div>
</body>
</html>
