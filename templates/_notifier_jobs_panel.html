<div class="card p-3"><table class="table"><thead><tr><th>名称</th><th>类型</th><th>Chat ID</th><th>状态</th><th>操作</th></tr></thead><tbody>
{% for n in notifiers %}<tr><td>{{ n.name }}</td><td>{{ n.type }}</td><td>{{ n.chat_id or '-' }}</td><td>{% if n.enabled %}<span class="badge text-bg-success">启用</span>{% else %}<span class="badge text-bg-secondary">禁用</span>{% endif %}</td><td>
<form class="d-inline js-ajax-form" action="/notifier/test/{{ n.id }}" method="POST" data-target="notifierJobsPanel"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-sm btn-outline-primary">测试</button></form>
<form class="d-inline js-ajax-form" action="/notifier/toggle/{{ n.id }}" method="POST" data-target="notifierJobsPanel"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-sm btn-outline-warning">{{ '禁用' if n.enabled else '启用' }}</button></form>
<form class="d-inline js-ajax-form" action="/notifier/delete/{{ n.id }}" method="POST" data-target="notifierJobsPanel"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-sm btn-outline-danger">删除</button></form>
</td></tr>{% endfor %}
</tbody></table></div>
