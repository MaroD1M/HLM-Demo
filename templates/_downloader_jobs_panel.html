<div class="section-card">
  <div class="table-responsive table-shell">
    <table class="table table-grid">
    <thead>
      <tr><th>名称</th><th>类型</th><th>地址</th><th>代理</th><th>状态</th><th>操作</th></tr>
    </thead>
    <tbody>
    {% for d in downloaders %}
      <tr>
        <td>{{ d.name }}</td>
        <td>{{ d.type }}</td>
        <td>{{ d.host }}:{{ d.port }}</td>
        <td><small>{{ d.proxy_url or '全局' }}</small></td>
        <td>{% if d.enabled %}<span class="badge text-bg-success">启用</span>{% else %}<span class="badge text-bg-secondary">禁用</span>{% endif %}</td>
        <td>
          <form class="d-inline js-ajax-form" action="/downloader/test/{{ d.id }}" method="POST" data-target="downloaderJobsPanel"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-sm btn-outline-primary">测试</button></form>
          <button class="btn btn-sm btn-outline-info" data-bs-toggle="modal" data-bs-target="#editDownloaderModal{{ d.id }}">修改</button>
          <form class="d-inline js-ajax-form" action="/downloader/toggle/{{ d.id }}" method="POST" data-target="downloaderJobsPanel"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-sm btn-outline-warning">{{ '禁用' if d.enabled else '启用' }}</button></form>
          <form class="d-inline js-ajax-form" action="/downloader/delete/{{ d.id }}" method="POST" data-target="downloaderJobsPanel" data-confirm="确认删除该下载器？"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-sm btn-outline-danger">删除</button></form>
        </td>
      </tr>
    {% endfor %}
    </tbody>
    </table>
  </div>
</div>

{% for d in downloaders %}
<div class="modal fade" id="editDownloaderModal{{ d.id }}" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form class="js-ajax-form" data-target="downloaderJobsPanel" action="/downloader/update/{{ d.id }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="modal-header"><h5 class="modal-title">修改下载器：{{ d.name }}</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="section-card mb-3">
            <div class="section-title mb-2">基础信息</div>
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label">名称</label><input class="form-control" name="name" value="{{ d.name }}" required></div>
              <div class="col-md-6"><label class="form-label">类型</label><select class="form-select" name="type"><option value="qbittorrent" {% if d.type=='qbittorrent' %}selected{% endif %}>qBittorrent</option></select></div>
            </div>
          </div>
          <div class="section-card">
            <div class="section-title mb-2">连接配置</div>
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label">主机</label><input class="form-control" name="host" value="{{ d.host }}" required></div>
              <div class="col-md-6"><label class="form-label">端口</label><input class="form-control" type="number" name="port" value="{{ d.port }}" required></div>
              <div class="col-md-6"><label class="form-label">用户名</label><input class="form-control" name="username" value="{{ d.username or '' }}"></div>
              <div class="col-md-6"><label class="form-label">密码（留空=不修改）</label><input class="form-control" type="password" name="password"></div>
              <div class="col-12"><label class="form-label">任务代理(可选)</label><input class="form-control" name="proxy_url" value="{{ d.proxy_url or '' }}" placeholder="留空=使用系统设置中的统一代理"></div>
            </div>
          </div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button type="submit" class="btn btn-brand">保存修改</button></div>
      </form>
    </div>
  </div>
</div>
{% endfor %}
