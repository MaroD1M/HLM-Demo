{% extends "base.html" %}
{% block title %}删除联动 - Hardlink Manager{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h3 class="mb-0">删除联动任务</h3><button class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#addModal">新建任务</button></div>
<div id="deleteJobsPanel">{% include "_delete_jobs_panel.html" %}</div>
<div class="modal fade" id="addModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><form action="/delete-monitor/add" method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="modal-header"><h5 class="modal-title">新建删除联动任务</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="mb-2"><label class="form-label">任务名称</label><input class="form-control" name="name" required></div><div class="mb-2"><label class="form-label">监控目录</label><input class="form-control" name="directory" required></div><div class="mb-2"><label class="form-label">事件</label><select class="form-select" name="events"><option value="unlink">文件删除</option><option value="unlinkDir">目录删除</option><option value="unlink,unlinkDir">两者</option></select></div><div class="mb-2"><label class="form-label">下载器</label><select class="form-select" name="downloader_id"><option value="">不关联</option>{% for d in downloaders %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}</select></div><div class="mb-2"><label class="form-label">通知器</label><select class="form-select" name="notifier_id"><option value="">不关联</option>{% for n in notifiers %}<option value="{{ n.id }}">{{ n.name }}</option>{% endfor %}</select></div><div class="mb-2"><label class="form-label">冷却秒数</label><input class="form-control" type="number" name="cooldown_seconds" value="120" min="0"></div><div class="mb-2"><label class="form-label">单次最大删除</label><input class="form-control" type="number" name="max_deletes_per_run" value="20" min="1"></div><div class="form-check"><input class="form-check-input" type="checkbox" name="dry_run" id="dry_run"><label class="form-check-label" for="dry_run">仅记录不执行</label></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button type="submit" class="btn btn-brand">保存</button></div></form></div></div></div>
{% endblock %}

{% block scripts %}
<script>
window.HLMAjax&&window.HLMAjax.bind();
</script>
{% endblock %}
