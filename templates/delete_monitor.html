{% extends "base.html" %}
{% block title %}删除联动 - Hardlink Manager{% endblock %}
{% block content %}
<div class="alert alert-info py-2">
  建议先开启“仅记录不执行（试运行）”验证规则，再切换正式执行。
  <i class="fa-solid fa-circle-info hint-icon ms-1" data-bs-toggle="tooltip" title="可先用小样本任务验证流程，再应用到正式目录"></i>
</div>

<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0">删除联动任务</h3>
  <button class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#addDeleteMonitorModal">新建任务</button>
</div>

<div id="deleteJobsPanel">{% include "_delete_jobs_panel.html" %}</div>

<div class="modal fade" id="addDeleteMonitorModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form class="js-ajax-form" data-target="deleteJobsPanel" action="/delete-monitor/add" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="modal-header">
          <h5 class="modal-title">新建删除联动任务</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label">任务名称</label>
            <input class="form-control" name="name" required>
          </div>
          <div class="mb-2">
            <label class="form-label">监控目录</label>
            <input class="form-control" name="directory" required>
          </div>
          <div class="mb-2">
            <label class="form-label">事件</label>
            <select class="form-select" name="events">
              <option value="unlink">文件删除</option>
              <option value="unlinkDir">目录删除</option>
              <option value="unlink,unlinkDir">两者</option>
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label">下载器</label>
            <select class="form-select" name="downloader_id">
              <option value="">不关联</option>
              {% for d in downloaders %}
              <option value="{{ d.id }}">{{ d.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label">通知器</label>
            <select class="form-select" name="notifier_id">
              <option value="">不关联</option>
              {% for n in notifiers %}
              <option value="{{ n.id }}">{{ n.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label">冷却秒数</label>
            <input class="form-control" type="number" name="cooldown_seconds" value="120" min="0">
          </div>
          <div class="mb-2">
            <label class="form-label">单次最大删除</label>
            <input class="form-control" type="number" name="max_deletes_per_run" value="20" min="1">
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="dry_run" id="add_delete_dry_run">
            <label class="form-check-label" for="add_delete_dry_run">仅记录不执行（试运行）</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="task_notify_on_delete" id="add_task_notify_on_delete" checked>
            <label class="form-check-label" for="add_task_notify_on_delete">任务成功通知（删除联动成功时通知）</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="task_notify_on_risky_delete" id="add_task_notify_on_risky_delete" checked>
            <label class="form-check-label" for="add_task_notify_on_risky_delete">任务风险通知（疑似误删待确认时通知）</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="submit" class="btn btn-brand">保存</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
window.HLMAjax&&window.HLMAjax.bind();
</script>
{% endblock %}
