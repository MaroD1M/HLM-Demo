{% extends "base.html" %}
{% block title %}通知器 - Hardlink Manager{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h3 class="mb-0">通知器</h3><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#add">新增</button></div>
<div id="notifierJobsPanel">{% include "_notifier_jobs_panel.html" %}</div>
<div class="modal fade" id="add" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><form action="/notifier/add" method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="modal-header"><h5 class="modal-title">新增通知器</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">
<div class="mb-2"><label class="form-label">名称</label><input class="form-control" name="name" required></div>
<div class="mb-2"><label class="form-label">类型</label><select class="form-select" name="type"><option value="telegram">Telegram</option></select></div>
<div class="mb-2"><label class="form-label">Bot Token</label><input class="form-control" name="api_key" required></div>
<div class="mb-2"><label class="form-label">Chat ID</label><input class="form-control" name="chat_id"></div>
</div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button class="btn btn-primary" type="submit">保存</button></div></form></div></div></div>
{% endblock %}

{% block scripts %}
<script>
window.HLMAjax&&window.HLMAjax.bind();
</script>
{% endblock %}
