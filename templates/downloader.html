{% extends "base.html" %}
{% block title %}下载器 - Hardlink Manager{% endblock %}
{% block content %}
<div class="section-card mb-3"><div class="alert alert-info py-2">
  下载器用于绑定 qBittorrent，测试按钮会验证连接与账号是否可用。
  <i class="fa-solid fa-circle-info hint-icon ms-1" data-bs-toggle="tooltip" title="可先用小样本任务验证流程，再应用到正式目录"></i>
</div></div>

<div class="page-head">
  <h3 class="mb-0">下载器</h3>
  <button class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#addDownloaderModal">新增</button>
</div>

<div class="section-card"><div class="section-title mb-2">下载器列表</div><div id="downloaderJobsPanel">{% include "_downloader_jobs_panel.html" %}</div></div>

<div class="modal fade" id="addDownloaderModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form class="js-ajax-form" data-target="downloaderJobsPanel" action="/downloader/add" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="modal-header">
          <h5 class="modal-title">新增下载器</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="section-card mb-3">
            <div class="section-title mb-2">基础信息</div>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">名称</label>
                <input class="form-control" name="name" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">类型</label>
                <select class="form-select" name="type">
                  <option value="qbittorrent">qBittorrent</option>
                </select>
              </div>
            </div>
          </div>
          <div class="section-card">
            <div class="section-title mb-2">连接配置</div>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">主机</label>
                <input class="form-control" name="host" placeholder="http://127.0.0.1" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">端口</label>
                <input class="form-control" type="number" name="port" value="8080" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">用户名</label>
                <input class="form-control" name="username">
              </div>
              <div class="col-md-6">
                <label class="form-label">密码</label>
                <input class="form-control" type="password" name="password">
              </div>
              <div class="col-md-6">
                <label class="form-label">会话复用时长(秒)</label>
                <input class="form-control" type="number" name="session_ttl_seconds" min="60" max="86400" placeholder="留空=系统默认(900)">
                <div class="form-text">建议 300-3600；过小会频繁重登，过大可能延迟失效会话更新。</div>
              </div>
              <div class="col-md-6">
                <label class="form-label">任务代理(可选)</label>
                <input class="form-control" name="proxy_url" placeholder="留空=使用系统设置中的统一代理">
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button class="btn btn-brand" type="submit">保存</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
window.HLMAjax&&window.HLMAjax.bind();
</script>
{% endblock %}
