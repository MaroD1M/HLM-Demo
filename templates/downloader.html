{% extends "base.html" %}
{% block title %}下载器 - Hardlink Manager{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h3 class="mb-0">下载器</h3><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#add">新增</button></div>
<div id="downloaderJobsPanel">{% include "_downloader_jobs_panel.html" %}</div>
<div class="modal fade" id="add" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><form class="js-ajax-form" data-target="downloaderJobsPanel" action="/downloader/add" method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="modal-header"><h5 class="modal-title">新增下载器</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">
<div class="mb-2"><label class="form-label">名称</label><input class="form-control" name="name" required></div>
<div class="mb-2"><label class="form-label">类型</label><select class="form-select" name="type"><option value="qbittorrent">qBittorrent</option></select></div>
<div class="mb-2"><label class="form-label">主机</label><input class="form-control" name="host" placeholder="http://127.0.0.1" required></div>
<div class="mb-2"><label class="form-label">端口</label><input class="form-control" type="number" name="port" value="8080" required></div>
<div class="mb-2"><label class="form-label">用户名</label><input class="form-control" name="username"></div>
<div class="mb-2"><label class="form-label">密码</label><input class="form-control" type="password" name="password"></div><div class="mb-2"><label class="form-label">任务代理(可选)</label><input class="form-control" name="proxy_url" placeholder="留空=使用全局proxy_url"></div>
</div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button class="btn btn-primary" type="submit">保存</button></div></form></div></div></div>
{% endblock %}

{% block scripts %}
<script>
window.HLMAjax&&window.HLMAjax.bind();
</script>
{% endblock %}
