{% extends "base.html" %}
{% block title %}设置 - Hardlink Manager{% endblock %}
{% block content %}
<h3 class="mb-3">系统设置</h3>
<div class="card p-3"><form action="/settings/save" method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<div class="row g-3">
<div class="col-md-4"><label class="form-label">日志保留天数</label><input class="form-control" type="number" name="log_retention_days" value="{{ settings.get('log_retention_days', 30) }}"></div>
<div class="col-md-4"><label class="form-label">自动清理日志</label><select class="form-select" name="auto_clean_logs"><option value="true" {% if settings.get('auto_clean_logs')=='true' %}selected{% endif %}>启用</option><option value="false" {% if settings.get('auto_clean_logs')=='false' %}selected{% endif %}>禁用</option></select></div>
<div class="col-md-4"><label class="form-label">默认扩展名</label><input class="form-control" name="default_extensions" value="{{ settings.get('default_extensions', '.mkv,.mp4,.avi,.mov') }}"></div>
<div class="col-md-6"><label class="form-label">默认排除目录</label><input class="form-control" name="default_exclude_dirs" value="{{ settings.get('default_exclude_dirs', 'sample,subs') }}"></div>
<div class="col-md-6"><label class="form-label">路径白名单根目录</label><input class="form-control" name="allowed_roots" value="{{ settings.get('allowed_roots','') }}" placeholder="/downloads,/media"></div>
<div class="col-md-4"><label class="form-label">删种同时删文件</label><select class="form-select" name="delete_files_with_torrent"><option value="true" {% if settings.get('delete_files_with_torrent')=='true' %}selected{% endif %}>是</option><option value="false" {% if settings.get('delete_files_with_torrent')=='false' %}selected{% endif %}>否</option></select></div>
<div class="col-md-4"><label class="form-label">删除延迟(秒)</label><input class="form-control" type="number" name="delete_delay_seconds" value="{{ settings.get('delete_delay_seconds',120) }}"></div>
<div class="col-md-2"><label class="form-label">硬链接通知</label><select class="form-select" name="notify_on_hardlink"><option value="true" {% if settings.get('notify_on_hardlink')=='true' %}selected{% endif %}>开</option><option value="false" {% if settings.get('notify_on_hardlink')=='false' %}selected{% endif %}>关</option></select></div>
<div class="col-md-2"><label class="form-label">删除通知</label><select class="form-select" name="notify_on_delete"><option value="true" {% if settings.get('notify_on_delete')=='true' %}selected{% endif %}>开</option><option value="false" {% if settings.get('notify_on_delete')=='false' %}selected{% endif %}>关</option></select></div>
<div class="col-md-6"><label class="form-label">Telegram 代理地址</label><input class="form-control" name="tg_proxy_url" value="{{ settings.get('tg_proxy_url','') }}" placeholder="http://127.0.0.1:7890"></div>
<div class="col-md-6"><label class="form-label">Telegram API Base</label><input class="form-control" name="tg_api_base" value="{{ settings.get('tg_api_base','https://api.telegram.org') }}" placeholder="https://api.telegram.org"></div>
</div>
<div class="mt-3"><button class="btn btn-primary" type="submit">保存设置</button></div>
</form></div>
{% endblock %}
