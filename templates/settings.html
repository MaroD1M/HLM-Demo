{% extends "base.html" %}
{% block title %}设置 - Hardlink Manager{% endblock %}
{% block content %}
<div class="page-head">
  <h3 class="mb-0">系统设置</h3>
  <div class="page-actions">
    <button class="btn btn-outline-secondary" type="button" data-help-target="pageHelp" aria-expanded="false"><i class="fa-solid fa-circle-info me-1"></i><span class="help-toggle-label">页面说明</span></button>
  </div>
</div>

<div id="pageHelp" class="section-card mb-3 d-none"><div class="section-muted">本页按功能分区保存；修改后可按分区保存或保存全部设置。</div></div>

<div class="section-card" id="settingsPagePanel">
  <form class="js-ajax-form settings-grid" data-target="settingsPagePanel" action="/settings/save" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div class="section-card mb-3">
      <div class="section-title mb-2">通用模板（新建任务默认值）</div>
      <div class="row g-3">
        <div class="col-md-6 section-subcard"><label class="form-label">默认扩展名</label><input class="form-control" name="default_extensions" value="{{ settings.get('default_extensions', '.mkv,.mp4,.avi,.mov') }}"></div>
        <div class="col-md-6 section-subcard"><label class="form-label">默认排除目录</label><input class="form-control" name="default_exclude_dirs" value="{{ settings.get('default_exclude_dirs', 'sample,subs') }}"></div>
      </div>
      <div class="settings-actions mt-3"><button class="btn btn-outline-primary" type="submit" name="save_scope" value="general_template">保存通用模板</button></div>
    </div>

    <div class="section-card mb-3">
      <div class="section-title mb-2">日志与清理</div>
      <div class="row g-3">
        <div class="col-md-3 section-subcard"><label class="form-label">日志保留天数</label><input class="form-control" type="number" name="log_retention_days" value="{{ settings.get('log_retention_days', 30) }}"></div>
        <div class="col-md-3 section-subcard"><label class="form-label">自动清理日志</label><select class="form-select" name="auto_clean_logs"><option value="true" {% if settings.get('auto_clean_logs')=='true' %}selected{% endif %}>启用</option><option value="false" {% if settings.get('auto_clean_logs')=='false' %}selected{% endif %}>禁用</option></select></div>
        <div class="col-md-3 section-subcard"><label class="form-label">应用日志单文件(MB)</label><input class="form-control" type="number" min="1" name="app_log_max_mb" value="{{ settings.get('app_log_max_mb', 10) }}"></div>
        <div class="col-md-3 section-subcard"><label class="form-label">应用日志保留文件数</label><input class="form-control" type="number" min="1" name="app_log_backup_count" value="{{ settings.get('app_log_backup_count', 5) }}"></div>
      </div>
      <div class="settings-actions mt-3"><button class="btn btn-outline-primary" type="submit" name="save_scope" value="log_cleanup">保存日志与清理</button></div>
    </div>

    <div class="section-card mb-3">
      <div class="section-title mb-2">删除联动与通知</div>
      <div class="row g-3">
        <div class="col-md-4 section-subcard"><label class="form-label">删种同时删文件</label><select class="form-select" name="delete_files_with_torrent"><option value="true" {% if settings.get('delete_files_with_torrent')=='true' %}selected{% endif %}>是</option><option value="false" {% if settings.get('delete_files_with_torrent')=='false' %}selected{% endif %}>否</option></select></div>
        <div class="col-md-4 section-subcard"><label class="form-label">删除通知</label><select class="form-select" name="notify_on_delete"><option value="true" {% if settings.get('notify_on_delete')=='true' %}selected{% endif %}>开</option><option value="false" {% if settings.get('notify_on_delete')=='false' %}selected{% endif %}>关</option></select></div>
        <div class="col-md-4 section-subcard"><label class="form-label">疑似误删通知</label><select class="form-select" name="notify_on_risky_delete"><option value="true" {% if settings.get('notify_on_risky_delete','true')=='true' %}selected{% endif %}>开（推荐）</option><option value="false" {% if settings.get('notify_on_risky_delete')=='false' %}selected{% endif %}>关</option></select></div>
        <div class="col-md-4 section-subcard"><label class="form-label">自动删种匹配策略</label><select class="form-select" name="delete_match_strict_mode"><option value="true" {% if settings.get('delete_match_strict_mode','true')=='true' %}selected{% endif %}>严格</option><option value="false" {% if settings.get('delete_match_strict_mode')=='false' %}selected{% endif %}>宽松</option></select></div>
        <div class="col-md-4 section-subcard"><label class="form-label">待判定来源保护</label><select class="form-select" name="pending_source_guard_enabled"><option value="true" {% if settings.get('pending_source_guard_enabled','true')=='true' %}selected{% endif %}>开启</option><option value="false" {% if settings.get('pending_source_guard_enabled')=='false' %}selected{% endif %}>关闭</option></select></div>
        <div class="col-md-4 section-subcard"><label class="form-label">待判定窗口(秒)</label><input class="form-control" type="number" min="0" name="pending_source_guard_seconds" value="{{ settings.get('pending_source_guard_seconds', 900) }}"></div>
        <div class="col-md-4 section-subcard"><label class="form-label">待判定告警阈值</label><input class="form-control" type="number" min="1" name="pending_source_warn_threshold" value="{{ settings.get('pending_source_warn_threshold', 200) }}"></div>
        <div class="col-md-4 section-subcard"><label class="form-label">待判定日志模式</label><select class="form-select" name="pending_source_log_mode"><option value="aggregate" {% if settings.get('pending_source_log_mode','aggregate')=='aggregate' %}selected{% endif %}>聚合</option><option value="detail" {% if settings.get('pending_source_log_mode')=='detail' %}selected{% endif %}>明细</option></select></div>
      </div>
      <div class="settings-actions mt-3"><button class="btn btn-outline-primary" type="submit" name="save_scope" value="delete_notify">保存删除联动与通知</button></div>
    </div>

    <div class="section-card mb-3">
      <div class="section-title mb-2">来源感知联动策略</div>
      <div class="row g-3">
        <div class="col-md-6 section-subcard"><label class="form-label">手动文件：删除目标后删除源文件</label><select class="form-select" name="manual_dest_delete_delete_source"><option value="true" {% if settings.get('manual_dest_delete_delete_source','true')=='true' %}selected{% endif %}>开启</option><option value="false" {% if settings.get('manual_dest_delete_delete_source')=='false' %}selected{% endif %}>关闭</option></select></div>
        <div class="col-md-6 section-subcard"><label class="form-label">手动文件：删除源文件后删除目标</label><select class="form-select" name="manual_source_delete_delete_dest"><option value="true" {% if settings.get('manual_source_delete_delete_dest','true')=='true' %}selected{% endif %}>开启</option><option value="false" {% if settings.get('manual_source_delete_delete_dest')=='false' %}selected{% endif %}>关闭</option></select></div>
        <div class="col-md-6 section-subcard"><label class="form-label">下载器文件：删除目标后删除源文件</label><select class="form-select" name="downloader_dest_delete_delete_source"><option value="true" {% if settings.get('downloader_dest_delete_delete_source','true')=='true' %}selected{% endif %}>开启</option><option value="false" {% if settings.get('downloader_dest_delete_delete_source')=='false' %}selected{% endif %}>关闭</option></select></div>
        <div class="col-md-6 section-subcard"><label class="form-label">下载器文件：删除源文件后删除目标</label><select class="form-select" name="downloader_source_delete_delete_dest"><option value="true" {% if settings.get('downloader_source_delete_delete_dest','true')=='true' %}selected{% endif %}>开启</option><option value="false" {% if settings.get('downloader_source_delete_delete_dest')=='false' %}selected{% endif %}>关闭</option></select></div>
        <div class="col-md-6 section-subcard"><label class="form-label">下载器文件：删除目标后删除种子</label><select class="form-select" name="downloader_dest_delete_delete_torrent"><option value="true" {% if settings.get('downloader_dest_delete_delete_torrent','true')=='true' %}selected{% endif %}>开启</option><option value="false" {% if settings.get('downloader_dest_delete_delete_torrent')=='false' %}selected{% endif %}>关闭</option></select></div>
        <div class="col-md-6 section-subcard"><label class="form-label">下载器文件：删除源文件后删除种子</label><select class="form-select" name="downloader_source_delete_delete_torrent"><option value="true" {% if settings.get('downloader_source_delete_delete_torrent','true')=='true' %}selected{% endif %}>开启</option><option value="false" {% if settings.get('downloader_source_delete_delete_torrent')=='false' %}selected{% endif %}>关闭</option></select></div>
      </div>
      <div class="settings-actions mt-3"><button class="btn btn-outline-primary" type="submit" name="save_scope" value="source_policy">保存来源感知策略</button></div>
    </div>

    <div class="section-card mb-3">
      <div class="section-title mb-2">网络与通知</div>
      <div class="row g-3">
        <div class="col-md-4 section-subcard"><label class="form-label">路径白名单根目录</label><input class="form-control" name="allowed_roots" value="{{ settings.get('allowed_roots','') }}" placeholder="/downloads,/media"></div>
        <div class="col-md-4 section-subcard"><label class="form-label">统一外网代理地址</label><input class="form-control" name="proxy_url" value="{{ settings.get('proxy_url','') }}" placeholder="http://127.0.0.1:7890"></div>
        <div class="col-md-4 section-subcard"><label class="form-label">Telegram API Base</label><input class="form-control" name="tg_api_base" value="{{ settings.get('tg_api_base','https://api.telegram.org') }}"></div>
      </div>
      <div class="settings-actions mt-3"><button class="btn btn-outline-primary" type="submit" name="save_scope" value="network_notify">保存网络与通知</button></div>
    </div>

    <div class="section-card mb-3">
      <div class="section-title mb-2">自动关联性能与匹配</div>
      <div class="row g-3">
        <div class="col-md-3 section-subcard"><label class="form-label">自动关联批次大小</label><input class="form-control" type="number" min="50" max="3000" name="backfill_batch_limit" value="{{ settings.get('backfill_batch_limit', 500) }}"></div>
        <div class="col-md-3 section-subcard"><label class="form-label">候选上限</label><input class="form-control" type="number" min="20" max="500" name="backfill_max_candidates" value="{{ settings.get('backfill_max_candidates', 120) }}"></div>
        <div class="col-md-3 section-subcard"><label class="form-label">文件列表并发数</label><input class="form-control" type="number" min="1" max="16" name="backfill_file_fetch_workers" value="{{ settings.get('backfill_file_fetch_workers', 4) }}"></div>
        <div class="col-md-3 section-subcard"><label class="form-label">失败跳过阈值</label><input class="form-control" type="number" min="0" max="10" name="backfill_max_failures" value="{{ settings.get('backfill_max_failures', 2) }}"></div>
        <div class="col-12 section-subcard"><label class="form-label">路径映射规则</label><input class="form-control" name="backfill_path_mappings" value="{{ settings.get('backfill_path_mappings','') }}" placeholder="/host/path=>/container/path;/a=>/b"></div>
      </div>
      <div class="settings-actions mt-3"><button class="btn btn-outline-primary" type="submit" name="save_scope" value="backfill">保存自动关联配置</button></div>
    </div>

    <div class="section-card mb-2">
      <div class="section-title mb-2">备份</div>
      <div class="row g-3">
        <div class="col-md-8 section-subcard"><label class="form-label">数据库备份目录</label><input class="form-control" name="backup_dir" value="{{ settings.get('backup_dir','/app/data/backups') }}"></div>
        <div class="col-md-4 section-subcard"><label class="form-label">备份保留份数</label><input class="form-control" type="number" min="1" name="backup_keep_last" value="{{ settings.get('backup_keep_last', 7) }}"></div>
      </div>
      <div class="settings-actions mt-3"><button class="btn btn-outline-primary" type="submit" name="save_scope" value="backup">保存备份配置</button></div>
    </div>

    <div class="mt-3 settings-actions">
      <button class="btn btn-brand" type="submit">保存全部设置</button>
      <a class="btn btn-outline-secondary" href="/settings/devops">前往开发与更新</a>
    </div>
  </form>
</div>
{% endblock %}
