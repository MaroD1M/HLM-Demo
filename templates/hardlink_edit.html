{% extends "base.html" %}
{% block title %}编辑硬链接任务 - Hardlink Manager{% endblock %}
{% block content %}
<div class="page-head">
  <h3 class="mb-0">编辑硬链接任务</h3>
  <div class="page-actions">
    <a class="btn btn-outline-primary" href="/hardlink"><i class="fa-solid fa-arrow-left me-1"></i>返回任务列表</a>
  </div>
</div>

<div class="section-card mb-3">
  <div class="d-flex gap-2 flex-wrap">
    <a class="btn btn-sm btn-outline-secondary" href="#section-basic">基础设置</a>
        <a class="btn btn-sm btn-outline-secondary" href="#section-delete">删除联动</a>
  </div>
</div>
<form class="section-card js-ajax-form" action="/hardlink/update/{{ task.id }}" method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <div id="section-basic" class="section-title mb-2">基础设置</div>
  <div class="row g-3">
    <div class="col-md-6 section-subcard"><label class="form-label">任务名称</label><input class="form-control" name="name" value="{{ task.name }}" required></div>
    <div class="col-md-6 section-subcard"><label class="form-label">扩展名白名单</label><input class="form-control" name="extensions" value="{{ task.extensions }}"></div>
    <div class="col-md-6 section-subcard"><label class="form-label">源目录</label><input class="form-control" name="source_dir" value="{{ task.source_dir }}" required></div>
    <div class="col-md-6 section-subcard"><label class="form-label">目标目录</label><input class="form-control" name="dest_dir" value="{{ task.dest_dir }}" required></div>
    <div class="col-md-6 section-subcard"><label class="form-label">排除目录</label><input class="form-control" name="exclude_dirs" value="{{ task.exclude_dirs or "" }}"></div>
    <div class="col-md-6 section-subcard"><label class="form-label">排除扩展名</label><input class="form-control" name="exclude_extensions" value="{{ task.exclude_extensions or "" }}" placeholder=".nfo,.jpg"></div>
    <div class="col-md-6 section-subcard"><label class="form-label">最小文件年龄(秒)</label><input class="form-control" type="number" name="min_file_age_seconds" value="{{ task.min_file_age_seconds }}"></div>

    <div class="col-12 section-subcard">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-2">
        <label class="form-label mb-0">入库行为</label>
        <i class="fa-solid fa-circle-info hint-icon" data-bs-toggle="tooltip" title="示例：源 /media/源目录/a.mkv -> 目标 /media/目标目录/a/a.mkv；关闭“创建同名目录”后则为 /media/目标目录/a.mkv"></i>
      </div>
      <div class="row g-2">
        <div class="col-md-6"><div class="form-check"><input class="form-check-input" type="checkbox" name="create_folder" {% if task.create_folder %}checked{% endif %}><label class="form-check-label">创建同名目录</label></div></div>
        <div class="col-md-6"><div class="form-check"><input class="form-check-input" type="checkbox" name="use_cache" {% if task.use_cache %}checked{% endif %}><label class="form-check-label">启用缓存</label></div></div>
      </div>
    </div>
  </div>


  <div id="section-delete" class="section-title mt-4 mb-2">删除联动</div>
  <div class="row g-3">
    <div class="col-md-6 section-subcard">
      <div class="form-label mb-2">监控范围</div>
      <div class="form-check"><input class="form-check-input" type="checkbox" name="monitor_source_delete" {% if task.monitor_source_delete %}checked{% endif %}><label class="form-check-label">监控源目录删除</label></div>
      <div class="form-check"><input class="form-check-input" type="checkbox" name="monitor_dest_delete" {% if task.monitor_dest_delete %}checked{% endif %}><label class="form-check-label">监控目标目录删除</label></div>
    </div>
    <div class="col-md-6 section-subcard">
      <div class="form-label mb-2">执行策略</div>
      <div class="form-check"><input class="form-check-input" type="checkbox" name="delete_dry_run" {% if task.delete_dry_run %}checked{% endif %}><label class="form-check-label">仅记录不执行（测试模式）</label></div>
      <div class="form-check"><input class="form-check-input" type="checkbox" name="delete_notify_on_delete" {% if task.delete_notify_on_delete %}checked{% endif %}><label class="form-check-label">成功通知</label></div>
      <div class="form-check"><input class="form-check-input" type="checkbox" name="delete_notify_on_risky_delete" {% if task.delete_notify_on_risky_delete %}checked{% endif %}><label class="form-check-label">风险通知</label></div>
    </div>
    <div class="col-md-6 section-subcard"><label class="form-label">删除联动下载器（可选）</label><select class="form-select" name="delete_downloader_id"><option value="">不关联</option>{% for d in downloaders %}<option value="{{ d.id }}" {% if task.delete_downloader_id==d.id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></div>
    <div class="col-md-6 section-subcard"><label class="form-label">删除联动通知器（可选）</label><select class="form-select" name="delete_notifier_id"><option value="">不关联</option>{% for n in notifiers %}<option value="{{ n.id }}" {% if task.delete_notifier_id==n.id %}selected{% endif %}>{{ n.name }}</option>{% endfor %}</select></div>
    <div class="col-md-6 section-subcard"><label class="form-label">删除冷却(秒)</label><input class="form-control" type="number" name="delete_cooldown_seconds" value="{{ task.delete_cooldown_seconds or 120 }}" min="0"></div>
    <div class="col-md-6 section-subcard"><label class="form-label">单次最大删除</label><input class="form-control" type="number" name="delete_max_deletes_per_run" value="{{ task.delete_max_deletes_per_run or 20 }}" min="1"></div>
  </div>

  <div class="settings-actions mt-4"><button class="btn btn-brand" type="submit">保存修改</button><a class="btn btn-outline-secondary" href="/hardlink">取消</a><a class="btn btn-outline-primary" href="/hardlink">返回任务列表</a></div>
</form>
{% endblock %}
