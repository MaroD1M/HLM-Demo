{% extends "base.html" %}
{% block title %}硬链接任务 - Hardlink Manager{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h3 class="mb-0">硬链接任务</h3><button class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#addTaskModal"><i class="fa-solid fa-plus"></i> 新建任务</button></div>
<div class="card p-3"><div class="table-responsive"><table class="table"><thead><tr><th>名称</th><th>源目录</th><th>目标目录</th><th>状态</th><th>操作</th></tr></thead><tbody>{% for t in tasks %}<tr><td>{{ t.name }}</td><td>{{ t.source_dir }}</td><td>{{ t.dest_dir }}</td><td>{% if t.enabled %}<span class="badge text-bg-success">启用</span>{% else %}<span class="badge text-bg-secondary">禁用</span>{% endif %}</td><td><form class="d-inline" action="/hardlink/execute/{{ t.id }}" method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-sm btn-outline-primary">立即执行</button></form> <form class="d-inline" action="/hardlink/toggle/{{ t.id }}" method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-sm btn-outline-warning">切换</button></form> <form class="d-inline" action="/hardlink/delete/{{ t.id }}" method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-sm btn-outline-danger">删除</button></form></td></tr>{% endfor %}</tbody></table></div></div>
<div class="modal fade" id="addTaskModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><form action="/hardlink/add" method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="modal-header"><h5 class="modal-title">新建硬链接任务</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body row g-3"><div class="col-md-6"><label class="form-label">任务名称</label><input class="form-control" name="name" required></div><div class="col-md-6"><label class="form-label">扩展名白名单</label><input class="form-control" name="extensions" value="{{ default_extensions }}"></div><div class="col-md-6"><label class="form-label">源目录</label><input class="form-control" name="source_dir" required></div><div class="col-md-6"><label class="form-label">目标目录</label><input class="form-control" name="dest_dir" required></div><div class="col-md-6"><label class="form-label">排除目录</label><input class="form-control" name="exclude_dirs" placeholder="sample,subs"></div><div class="col-md-6"><label class="form-label">排除扩展名</label><input class="form-control" name="exclude_extensions" placeholder=".nfo,.jpg"></div><div class="col-md-6"><label class="form-label">最小文件年龄(秒)</label><input class="form-control" type="number" name="min_file_age_seconds" value="300"></div><div class="col-md-6 d-flex align-items-end gap-3"><div class="form-check"><input class="form-check-input" type="checkbox" name="create_folder" checked><label class="form-check-label">按源目录建同名文件夹</label></div><div class="form-check"><input class="form-check-input" type="checkbox" name="use_cache" checked><label class="form-check-label">启用缓存</label></div></div></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal" type="button">取消</button><button class="btn btn-brand" type="submit">保存</button></div></form></div></div></div>
{% endblock %}
