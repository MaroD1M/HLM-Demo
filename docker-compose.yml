services:
  hlm:
    image: ghcr.io/marod1m/hlm-demo:latest
    container_name: hlm-demo
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      APP_USERNAME: ${APP_USERNAME:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-10}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # Flask instance dir: sqlite db and runtime state
      - ./data/instance:/app/instance
      # Optional folders you will reference in tasks
      - ${DOWNLOADS_PATH:-./data/downloads}:/downloads
      - ${LIBRARY_PATH:-./data/library}:/library
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
