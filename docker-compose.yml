services:
  hlm:
    image: ghcr.io/marod1m/hlm-demo:latest
    container_name: hlm-demo
    restart: unless-stopped
    # 显式使用 bridge 网络，确保容器可正常访问外网（如 Telegram API）
    network_mode: bridge
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      # 应用密钥（首次部署请务必修改）
      SECRET_KEY: ${SECRET_KEY}
      # 可选：访问账号密码（留空=不启用登录）
      APP_USERNAME: ${APP_USERNAME:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      # 可选：HTTP 请求超时（秒）
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-10}
      # 访问日志（写入容器stdout，群晖日志页可见）
      ACCESS_LOG_ENABLED: ${ACCESS_LOG_ENABLED:-true}
      # 时区
      TZ: ${TZ:-Asia/Shanghai}
      # 关闭Python输出缓冲，确保群晖容器日志实时可见
      PYTHONUNBUFFERED: "1"
      # 应用日志分割（避免日志过大）
      APP_LOG_MAX_MB: ${APP_LOG_MAX_MB:-10}
      APP_LOG_BACKUP_COUNT: ${APP_LOG_BACKUP_COUNT:-5}
    volumes:
      # 必须：数据库与运行状态
      - ./data/instance:/app/instance
      # 建议：数据库备份目录
      - ./data/backups:/app/data/backups
      # 建议：应用文件日志目录（配合日志分割）
      - ./data/logs:/app/data/logs
      # 推荐：只映射一个“媒体根目录”，任务里自行填写子目录
      # 例如：源目录 /media/downloads，目标目录 /media/library
      - ${MEDIA_ROOT:-./data/media}:/media
      # 可选（非必要）：如你更偏好双目录固定映射，取消注释下面两行
      # - ${DOWNLOADS_PATH:-./data/downloads}:/downloads
      # - ${LIBRARY_PATH:-./data/library}:/library
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
