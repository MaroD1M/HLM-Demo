services:
  hlm:
    # 镜像地址：默认拉取 latest（适合日常使用）
    image: ghcr.io/marod1m/hlm-demo:latest

    # 容器名称（可改）
    container_name: hlm-demo

    # 容器异常退出后自动重启
    restart: unless-stopped

    # 使用 bridge 网络，便于访问外网服务（如 Telegram / GitHub）
    network_mode: bridge

    ports:
      # 左侧是宿主机端口，右侧是容器端口
      # 想改访问端口，只改左边即可，例如 "8080:5000"
      - "${APP_PORT:-5000}:5000"

    environment:
      # =========================
      # 基础运行配置（建议先改这几项）
      # =========================

      # 必填：应用密钥（请改成强随机字符串）
      SECRET_KEY: ${SECRET_KEY}

      # 登录账号密码（两项都填才启用登录）
      # 任一为空 = 不强制登录
      APP_USERNAME: ${APP_USERNAME:-}
      APP_PASSWORD: ${APP_PASSWORD:-}

      # 请求超时（秒）
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-10}

      ACCESS_LOG_ENABLED: ${ACCESS_LOG_ENABLED:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      HLM_ALLOW_NO_AUTH: ${HLM_ALLOW_NO_AUTH:-false}
      HLM_DISABLE_SCHEDULER: "true"
      HLM_SETUP_TOKEN: ${HLM_SETUP_TOKEN:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-8}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-300}

      # 时区
      TZ: ${TZ:-Asia/Shanghai}

      PYTHONUNBUFFERED: "1"

      APP_LOG_MAX_MB: ${APP_LOG_MAX_MB:-10}
      APP_LOG_BACKUP_COUNT: ${APP_LOG_BACKUP_COUNT:-5}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}

      # v0.5.1 起已彻底移除应用内开发模式；无需配置自动拉取或依赖同步。

    volumes:
      # =========================
      # 数据目录（建议保留）
      # =========================

      # 数据库与运行状态（必须）
      - ./data/instance:/app/instance

      # 数据库备份目录（建议）
      - ./data/backups:/app/data/backups

      - ./data/logs:/app/data/logs
      - ./data/recycle:/app/data/recycle

      # 媒体根目录映射（推荐单目录映射）
      # 例如：容器内统一使用 /media/downloads 与 /media/library
      - ${MEDIA_ROOT:-./data/media}:/media

      # 如果你偏好固定双目录映射，可启用下面两行
      # - ${DOWNLOADS_PATH:-./data/downloads}:/downloads
      # - ${LIBRARY_PATH:-./data/library}:/library

    healthcheck:
      # 健康检查：访问 /api/health 返回200即为健康
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: ghcr.io/marod1m/hlm-demo:latest
    container_name: hlm-demo-worker
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      HLM_INSTANCE_PATH: /app/instance
      HLM_WORKER: "true"
      TZ: ${TZ:-Asia/Shanghai}
      PYTHONUNBUFFERED: "1"
      APP_LOG_MAX_MB: ${APP_LOG_MAX_MB:-10}
      APP_LOG_BACKUP_COUNT: ${APP_LOG_BACKUP_COUNT:-5}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    volumes:
      - ./data/instance:/app/instance
      - ./data/backups:/app/data/backups
      - ./data/logs:/app/data/logs
      - ./data/recycle:/app/data/recycle
      - ${MEDIA_ROOT:-./data/media}:/media
    entrypoint: ["python", "-u", "/app/worker.py"]
    depends_on:
      hlm:
        condition: service_healthy
  scheduler:
    image: ghcr.io/marod1m/hlm-demo:latest
    container_name: hlm-demo-scheduler
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      HLM_INSTANCE_PATH: /app/instance
      TZ: ${TZ:-Asia/Shanghai}
      PYTHONUNBUFFERED: "1"
      APP_LOG_MAX_MB: ${APP_LOG_MAX_MB:-10}
      APP_LOG_BACKUP_COUNT: ${APP_LOG_BACKUP_COUNT:-5}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    volumes:
      - ./data/instance:/app/instance
      - ./data/backups:/app/data/backups
      - ./data/logs:/app/data/logs
      - ./data/recycle:/app/data/recycle
      - ${MEDIA_ROOT:-./data/media}:/media
    entrypoint: ["python", "-u", "/app/scheduler.py"]
    depends_on:
      hlm:
        condition: service_healthy
